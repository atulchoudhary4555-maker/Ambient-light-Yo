name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ultimate Deep Clean and Create Pure Manifest
      run: |
        # 1. पूरे प्रोजेक्ट में जहां कहीं भी AndroidManifest.xml या fix.sh हो, उसे जड़ से मिटाना
        find . -name "AndroidManifest.xml" -exec rm -f {} +
        rm -f fix.sh
        
        # 2. सभी संभावित फोल्डर स्ट्रक्चर को एकदम फ्रेश बनाना
        mkdir -p src/main
        mkdir -p Ambient-light-Yo/src/main
        
        # 3. बिल्कुल सही 'android:' कड़ियों के साथ शुद्ध मैनिफेस्ट कोड तैयार करना
        cat << 'EOF' > manifest_template.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true"
                android:allowBackup="false">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 4. दोनों जगहों पर फ्रेश फाइल को जबरन कॉपी करना
        cp manifest_template.xml src/main/AndroidManifest.xml
        cp manifest_template.xml Ambient-light-Yo/src/main/AndroidManifest.xml
        
        echo "=== Deep Clean Complete. Fresh Manifest Written Everywhere ==="

    - name: Build with Gradle Direct
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          gradle clean assembleDebug
        else
          chmod +x "$GRADLEW_PATH"
          ./gradlew clean assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
