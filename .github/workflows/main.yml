name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Completely Overwrite and Force Correct Manifest
      run: |
        # 1. गिटहब के अंदर पुरानी सभी मैनिफेस्ट फाइलों को पूरी तरह डिलीट करना
        find . -name "AndroidManifest.xml" -delete
        
        # 2. नए सिरे से फ्रेश फोल्डर बनाना
        mkdir -p app/src/main
        
        # 3. बिल्कुल सही 'android:' नेमस्पेस के साथ शुद्ध मैनिफेस्ट कोड लिखना
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
        echo '    <application' >> app/src/main/AndroidManifest.xml
        echo '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar"' >> app/src/main/AndroidManifest.xml
        echo '        android:label="Ambient Light for YouTube"' >> app/src/main/AndroidManifest.xml
        echo '        android:hardwareAccelerated="true"' >> app/src/main/AndroidManifest.xml
        echo '        android:allowBackup="false">' >> app/src/main/AndroidManifest.xml
        echo '        <activity' >> app/src/main/AndroidManifest.xml
        echo '            android:name="com.shubham.ambientlight.MainActivity"' >> app/src/main/AndroidManifest.xml
        echo '            android:exported="true"' >> app/src/main/AndroidManifest.xml
        echo '            android:configChanges="orientation|screenSize|layoutDirection">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml
        
        echo "=== Created Fresh Manifest ==="
        cat app/src/main/AndroidManifest.xml

    - name: Build with Gradle (Smart Directory Search)
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Gradle wrapper not found, building with global gradle..."
          gradle assembleDebug
        else
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
