name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
    - name: Recreate Android Manifest
      run: |
        mkdir -p src/main
        cat << 'EOF' > src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://github.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
    - name: Build APK Direct
      run: gradle assembleDebug
    - name: Upload APK Product
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
