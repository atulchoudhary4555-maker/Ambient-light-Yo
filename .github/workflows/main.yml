name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Absolute Hard Reset and Overwrite Manifest
      run: |
        # 1. गिटहब के छिपे हुए डबल फोल्डर के अंदर सीधे घुसना और खराब फाइल को डिलीट करना
        rm -f fix.sh
        rm -rf Ambient-light-Yo/Ambient-light-Yo/src/main/AndroidManifest.xml
        rm -rf src/main/AndroidManifest.xml
        
        # 2. सही फोल्डर्स को नए सिरे से तैयार करना
        mkdir -p Ambient-light-Yo/Ambient-light-Yo/src/main
        
        # 3. बिल्कुल शुद्ध कड़ियों के साथ फ्रेश फाइल लिखना
        cat << 'EOF' > Ambient-light-Yo/Ambient-light-Yo/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true"
                android:allowBackup="false">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        echo "=== Absolute Overwrite Done ==="

    - name: Build with Gradle Direct
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        chmod +x "$GRADLEW_PATH"
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
