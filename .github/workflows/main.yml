name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Nuclear Clean and Recreate Manifest Everywhere
      run: |
        # 1. पूरे कंप्यूटर में किसी भी जगह मौजूद AndroidManifest.xml को जबरन डिलीट करना
        find . -name "AndroidManifest.xml" -type f -delete
        rm -f fix.sh
        
        # 2. शुद्ध मैनिफेस्ट टेम्पलेट तैयार करना
        cat << 'EOF' > clean_manifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true"
                android:allowBackup="false">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 3. जहां-जहां src/main फ़ोल्डर मिल सकता है, उन सभी रास्तों पर इसे जबरन लिखना
        for dir in $(find . -type d -name "main"); do
          if [[ "$dir" == *"/src/main" ]]; then
            echo "Writing pure manifest to: $dir"
            cp clean_manifest.xml "$dir/AndroidManifest.xml"
          fi
        done

    - name: Build with Gradle Direct
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          gradle clean assembleDebug
        else
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew clean assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
