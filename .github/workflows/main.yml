name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      
    - name: Recreate Correct Android Configuration Everywhere
      run: |
        # 1. पुरानी सभी गलत मैनिफेस्ट फाइलों को हटाकर फ्रेश बनाना
        find . -name "AndroidManifest.xml" -delete
        mkdir -p Ambient-light-Yo/Ambient-light-Yo/src/main
        
        # ऑटो-करेक्ट से बचने के लिए एंड्रॉइड यूआरएल को टुकड़ों में लिखना
        URL_SCHEMAS="http://android.com"
        
        cat << EOF > Ambient-light-Yo/Ambient-light-Yo/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="${URL_SCHEMAS}">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. प्लगइन एरर को जड़ से खत्म करने के लिए build.gradle को जबरन रीराइट करना
        cat << 'EOF' > Ambient-light-Yo/Ambient-light-Yo/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        
        repositories {
            google()
            mavenCentral()
        }
        
        apply plugin: 'com.android.application'
        
        android {
            namespace 'com.shubham.ambientlight'
            compileSdk 34
            
            defaultConfig {
                applicationId "com.shubham.ambientlight"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 3. settings.gradle को फ्रेश करना
        cat << 'EOF' > Ambient-light-Yo/Ambient-light-Yo/settings.gradle
        rootProject.name = "Ambient-light-Yo"
        EOF
        
        echo "=== Deep Configuration Fix Complete ==="

    - name: Build APK Direct
      run: |
        cd Ambient-light-Yo/Ambient-light-Yo
        gradle assembleDebug
        
    - name: Upload APK Product
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
