name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Absolute Hard Reset and Fix Configuration Files
      run: |
        rm -f fix.sh
        
        # 1. सभी जगह गलत मैनिफेस्ट फाइलों को हटाकर फ्रेश बनाना
        find . -name "AndroidManifest.xml" -delete
        mkdir -p Ambient-light-Yo/Ambient-light-Yo/src/main
        
        cat << 'EOF' > Ambient-light-Yo/Ambient-light-Yo/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true"
                android:allowBackup="false">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. प्लगइन एरर को जड़ से खत्म करने के लिए settings.gradle को ऑटो-फिक्स करना
        find . -name "settings.gradle" -delete
        cat << 'EOF' > Ambient-light-Yo/Ambient-light-Yo/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Ambient-light-Yo"
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Global Gradle Direct
      run: |
        # अंदर वाले फोल्डर में घुसकर सीधे बिल्ड करना
        cd Ambient-light-Yo/Ambient-light-Yo
        gradle clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
