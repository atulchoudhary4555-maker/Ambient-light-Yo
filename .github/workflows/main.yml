name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Completely Clean and Recreate Correct AndroidManifest
      run: |
        # पुरानी सभी गलत मैनिफेस्ट फाइलों को जड़ से डिलीट करना ताकि मर्जर एरर न आए
        find . -name "AndroidManifest.xml" -delete
        
        # बिल्कुल सही फोल्डर स्ट्रक्चर तैयार करना
        mkdir -p src/main
        mkdir -p app/src/main
        
        cat << 'EOF' > manifest_template.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:label="Ambient Light for YouTube"
                android:hardwareAccelerated="true"
                android:allowBackup="false">
                <activity
                    android:name="com.shubham.ambientlight.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # सिर्फ इन दो सही जगहों पर साफ कोड रखना
        cp manifest_template.xml src/main/AndroidManifest.xml
        cp manifest_template.xml app/src/main/AndroidManifest.xml

    - name: Build with Gradle (Smart Directory Search)
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Gradle wrapper not found, building with global gradle..."
          gradle assembleDebug
        else
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
