name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Force Overwrite Clean Manifest
      run: |
        # 1. गिटहब के पूरे पुराने फ़ोल्डर स्ट्रक्चर को पूरी तरह साफ़ करना
        rm -rf src/main/AndroidManifest.xml
        rm -rf app/src/main/AndroidManifest.xml
        
        # 2. ताज़ा फोल्डर बनाना
        mkdir -p src/main
        
        # 3. एक-एक लाइन को बिना किसी ऑटो-करेक्ट एरर के जबरन लिखना
        echo '<?xml version="1.0" encoding="utf-8"?>' > src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> src/main/AndroidManifest.xml
        echo '    <application' >> src/main/AndroidManifest.xml
        echo '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar"' >> src/main/AndroidManifest.xml
        echo '        android:label="Ambient Light for YouTube"' >> src/main/AndroidManifest.xml
        echo '        android:hardwareAccelerated="true"' >> src/main/AndroidManifest.xml
        echo '        android:allowBackup="false">' >> src/main/AndroidManifest.xml
        echo '        <activity' >> src/main/AndroidManifest.xml
        echo '            android:name="com.shubham.ambientlight.MainActivity"' >> src/main/AndroidManifest.xml
        echo '            android:exported="true"' >> src/main/AndroidManifest.xml
        echo '            android:configChanges="orientation|screenSize|layoutDirection">' >> src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> src/main/AndroidManifest.xml
        echo '        </activity>' >> src/main/AndroidManifest.xml
        echo '    </application>' >> src/main/AndroidManifest.xml
        echo '</manifest>' >> src/main/AndroidManifest.xml
        
        echo "=== Ultimate Fresh Manifest Output ==="
        cat src/main/AndroidManifest.xml

    - name: Clean Gradle and Build Direct
      run: |
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          gradle clean assembleDebug
        else
          chmod +x "$GRADLEW_PATH"
          ./gradlew clean assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
